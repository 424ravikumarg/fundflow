name: Fundflow CI/CD

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Select Environment (dev or prod)'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - prod

jobs:
  build-and-verify:
    name: Build & Verify Application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run TypeScript Check
        run: npx tsc --noEmit

      - name: Build Production Bundle
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1

  dev-preview:
    name: Dev — Localhost Preview
    needs: build-and-verify
    if: ${{ github.event.inputs.environment == 'dev' }}
    runs-on: ubuntu-latest

    steps:
      - name: Output Localhost Link & Instructions
        run: |
          echo "## 🛠️ Dev Build Verified" >> $GITHUB_STEP_SUMMARY
          echo "All TypeScript and Next.js build checks passed." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 💻 View on Your Laptop:" >> $GITHUB_STEP_SUMMARY
          echo "1. Pull the latest changes in your Mac terminal:" >> $GITHUB_STEP_SUMMARY
          echo "   \`\`\`bash" >> $GITHUB_STEP_SUMMARY
          echo "   cd /Users/ravimouni/fundflow && git pull origin main" >> $GITHUB_STEP_SUMMARY
          echo "   \`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "2. Start your local server:" >> $GITHUB_STEP_SUMMARY
          echo "   \`\`\`bash" >> $GITHUB_STEP_SUMMARY
          echo "   npm run dev" >> $GITHUB_STEP_SUMMARY
          echo "   \`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "3. Open **[http://localhost:3000](http://localhost:3000)** in your browser." >> $GITHUB_STEP_SUMMARY

  prod-deploy:
    name: Prod — Deploy to AWS EC2
    needs: build-and-verify
    if: ${{ github.event.inputs.environment == 'prod' }}
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to AWS Server via SSH
        env:
          HOST: ${{ secrets.EC2_HOST }}
          USERNAME: ${{ secrets.EC2_USER }}
          SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          SSH_PASSWORD: ${{ secrets.EC2_SSH_PASSWORD }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          if [ -z "$HOST" ] || [ -z "$USERNAME" ]; then
            echo "::error::Missing EC2_HOST or EC2_USER in GitHub Secrets!"
            exit 1
          fi

          # Prepare remote deployment script
          cat << 'DEPLOY_SCRIPT' > /tmp/remote_deploy.sh
          set -e
          # Ensure root has ec2-user's authorized_keys for future direct root SSH key logins
          if [ -f /home/ec2-user/.ssh/authorized_keys ]; then
            mkdir -p /root/.ssh
            cat /home/ec2-user/.ssh/authorized_keys >> /root/.ssh/authorized_keys
            sort -u /root/.ssh/authorized_keys -o /root/.ssh/authorized_keys
            chmod 700 /root/.ssh
            chmod 600 /root/.ssh/authorized_keys
          fi

          cd /opt/fundflow
          git config --global --add safe.directory /opt/fundflow 2>/dev/null || true

          # Authenticate private repository fetch using temporary GitHub token
          git remote set-url origin "https://x-access-token:__GH_TOKEN__@github.com/__REPO__.git"
          git fetch origin main
          git reset --hard origin/main
          git remote set-url origin "https://github.com/__REPO__.git"

          # Remove untracked large archives or installer files if present
          rm -f AWSCLIV2.pkg *.zip *.tar.gz 2>/dev/null || true

          # Clean up build cache and unused docker objects to guarantee free disk space
          docker builder prune -af 2>/dev/null || true
          docker image prune -f 2>/dev/null || true

          docker build -t fundflow .
          docker stop fundflow || true
          docker rm fundflow || true
          docker run -d \
            --name fundflow \
            --restart always \
            -p 127.0.0.1:3000:3000 \
            -v /opt/fundflow/storage:/app/storage \
            --env-file /opt/fundflow/.env.local \
            fundflow

          # Clean up dangling images created during build
          docker image prune -f 2>/dev/null || true

          sleep 3
          docker ps --filter "name=fundflow"
          echo ">>> Deployment completed successfully on server!"
          DEPLOY_SCRIPT

          sed -i "s|__GH_TOKEN__|${GH_TOKEN}|g" /tmp/remote_deploy.sh
          sed -i "s|__REPO__|${REPO}|g" /tmp/remote_deploy.sh

          mkdir -p ~/.ssh
          SSH_OPTS="-o StrictHostKeyChecking=no -o ConnectTimeout=20 -o PubkeyAcceptedKeyTypes=+ssh-rsa -o HostKeyAlgorithms=+ssh-rsa"
          DEPLOYED=0

          # 1. Try SSH Password first if EC2_SSH_PASSWORD is provided
          if [ -n "$SSH_PASSWORD" ]; then
            echo ">>> Attempting password authentication as $USERNAME@$HOST..."
            sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
            export SSHPASS="$SSH_PASSWORD"
            if sshpass -e ssh $SSH_OPTS -o PreferredAuthentications=password -o PubkeyAuthentication=no "$USERNAME@$HOST" "echo 'Password auth succeeded'" 2>/dev/null; then
              echo ">>> Connected via password as $USERNAME. Running deployment..."
              sshpass -e ssh $SSH_OPTS -o PreferredAuthentications=password -o PubkeyAuthentication=no "$USERNAME@$HOST" "sudo bash -s" < /tmp/remote_deploy.sh
              DEPLOYED=1
            fi
          fi

          # 2. Try SSH Key as $USERNAME, then fallback to ec2-user + sudo
          if [ "$DEPLOYED" -eq 0 ] && [ -n "$SSH_KEY" ]; then
            printf "%s\n" "$SSH_KEY" | tr -d '\r' > ~/.ssh/deploy_key
            chmod 600 ~/.ssh/deploy_key

            echo ">>> Attempting SSH key authentication as $USERNAME@$HOST..."
            if ssh $SSH_OPTS -o BatchMode=yes -i ~/.ssh/deploy_key "$USERNAME@$HOST" "echo 'Key auth succeeded'" 2>/dev/null; then
              echo ">>> Connected via SSH key as $USERNAME. Running deployment..."
              ssh $SSH_OPTS -o BatchMode=yes -i ~/.ssh/deploy_key "$USERNAME@$HOST" "sudo bash -s" < /tmp/remote_deploy.sh
              DEPLOYED=1
            elif [ "$USERNAME" != "ec2-user" ]; then
              echo ">>> Key rejected for $USERNAME; trying default AWS user ec2-user@$HOST with sudo..."
              if ssh $SSH_OPTS -o BatchMode=yes -i ~/.ssh/deploy_key "ec2-user@$HOST" "echo 'Key auth succeeded as ec2-user'" 2>/dev/null; then
                echo ">>> Connected via SSH key as ec2-user! Elevating to root via sudo and deploying..."
                ssh $SSH_OPTS -o BatchMode=yes -i ~/.ssh/deploy_key "ec2-user@$HOST" "sudo bash -s" < /tmp/remote_deploy.sh
                DEPLOYED=1
              fi
            fi
          fi

          if [ "$DEPLOYED" -eq 0 ]; then
            echo "::error::SSH authentication failed for both $USERNAME and ec2-user on $HOST."
            echo "Please check that either EC2_SSH_PASSWORD (your root password) or EC2_SSH_KEY (full PEM file) is valid in GitHub Secrets."
            exit 1
          fi

      - name: Output Production Link
        run: |
          echo "## 🚀 Production Deployment Complete" >> $GITHUB_STEP_SUMMARY
          echo "Live Application: **[http://${{ secrets.EC2_HOST }}](http://${{ secrets.EC2_HOST }})**" >> $GITHUB_STEP_SUMMARY
